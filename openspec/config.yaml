schema: spec-driven
context: |
  Language: zh-CN. Keep structural headings and SHALL/MUST in English.
  Product: PhotoCraft Agent Plugin. Current stage: implementation-in-progress.
  Plugin id: photocraft; source skills package: photocraft-skills (immutable development releases; current identity from skills.lock.json).
  OpenSpec active change is the only normative V1 authority; bilingual product docs explain it.
  Runtime bootstrap and native workflows have bounded version-specific evidence; full harness, optimization and release acceptance remain governed by tasks.
  Shared craft-task/v1 and craft-artifact/v1 are owned by artcraft-plugin; consumers reference them.
rules:
  specs:
    - Use stable requirement IDs, observable WHEN/THEN scenarios and at least one failure scenario.
    - Distinguish actual upstream runtime evidence from planned plugin behavior.
  tasks:
    - Keep every implementation task unchecked until its acceptance evidence exists.
    - Include requirement ID, expected output, dependency and validation evidence for each task.
