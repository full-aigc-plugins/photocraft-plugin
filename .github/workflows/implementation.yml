name: Skill snapshots and implementation units
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/vendor/skill_vendor.py check
      - name: Check command evidence against locked execution resources
        run: python3 -I -B scripts/command_acceptance.py check --skill-root skills/photocraft-use --index docs/evidence/optimization/command-acceptance/current-index.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Runtime unit tests when present
        run: |
          if test -f package.json; then
            npm test
          fi
      - name: Read fixed skill-source identity
        id: skill-source
        run: python3 -c "import json,os;v=json.load(open('skills.lock.json'))['sources'][0];f=open(os.environ['GITHUB_OUTPUT'],'a');print('sha='+v['sha'],file=f)"
      - uses: actions/checkout@v4
        with:
          repository: full-aigc-skills/photocraft-skills
          ref: ${{ steps.skill-source.outputs.sha }}
          path: .skills-authority
      - name: Check complete independent release combination
        run: python3 -I -B scripts/release_combination.py --skills-source .skills-authority
